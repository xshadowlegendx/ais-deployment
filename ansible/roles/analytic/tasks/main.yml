---
- name: Install podman
  ansible.builtin.dnf:
    name: podman
  when: ansible_os_family == 'RedHat'

- name: Install podman
  ansible.builtin.apt:
    name: podman
  when: ansible_os_family == 'Debian'

- name: Create data vg
  community.general.lvg:
    vg: data
    pvs: "{{ item }}"
    state: present
  loop: "{{ analytic_lvm_disks }}"

- name: Create lvs
  community.general.lvol:
    vg: data
    lv: "{{ item.lv }}"
    size: "{{ item.size }}"
    state: present
  with_items:
    - lv: clickhouse_log
      size: "{{ analytic_clickhouse_log_size }}"
    - lv: clickhouse
      size: "{{ analytic_clickhouse_data_size }}"

- name: Format lvs
  community.general.filesystem:
    dev: /dev/data/{{ item }}
    fstype: xfs
  with_items:
    - clickhouse_log
    - clickhouse

- name: Ensure clickhouse data dir exists
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0750"
    recurse: true
    state: directory
  with_items:
    - /var/lib/clickhouse/data
    - /var/lib/clickhouse/logs

- name: Ensure mount point exists
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: xfs
    opts: defaults
    state: mounted
  with_items:
    - path: /var/lib/clickhouse/logs
      src: /dev/data/clickhouse_log
    - path: /var/lib/clickhouse/data
      src: /dev/data/clickhouse

- name: Create analytic network
  ansible.builtin.copy:
    dest: /etc/containers/systemd/analytic.network
    mode: "0640"
    content: |
      [Network]
      NetworkName=analytic

- name: Ensure clickhouse config dir exists
  ansible.builtin.file:
    path: /etc/clickhouse-server/config.d
    state: directory
    recurse: true

- name: Add clickhouse trace log disk config
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/config.d/system-log-rotation.xml
    mode: "0640"
    content: |
      <clickhouse>
        <max_table_size_to_drop>60G</max_table_size_to_drop>
        <trace_log replace="1">
          <database>system</database>
          <table>trace_log</table>
          <partition_by>toYYYYMM(event_date)</partition_by>
          <flush_interval_milliseconds>7500</flush_interval_milliseconds>
          <max_size_rows>1048576</max_size_rows>
          <reserved_size_rows>8192</reserved_size_rows>
          <buffer_size_rows_flush_threshold>524288</buffer_size_rows_flush_threshold>
          <flush_on_crash>false</flush_on_crash>
          <symbolize>false</symbolize>
          <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 4 day</engine>
        </trace_log>

        <text_log replace="1">
          <database>system</database>
          <table>text_log</table>
          <partition_by>toYYYYMM(event_date)</partition_by>
          <flush_interval_milliseconds>7500</flush_interval_milliseconds>
          <max_size_rows>1048576</max_size_rows>
          <reserved_size_rows>8192</reserved_size_rows>
          <buffer_size_rows_flush_threshold>524288</buffer_size_rows_flush_threshold>
          <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 4 day</engine>
        </text_log>

        <metric_log replace="1">
          <database>system</database>
          <table>metric_log</table>
          <partition_by>toYYYYMM(event_date)</partition_by>
          <flush_interval_milliseconds>7500</flush_interval_milliseconds>
          <collect_interval_milliseconds>1000</collect_interval_milliseconds>
          <max_size_rows>1048576</max_size_rows>
          <reserved_size_rows>8192</reserved_size_rows>
          <buffer_size_rows_flush_threshold>524288</buffer_size_rows_flush_threshold>
          <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 4 day</engine>
        </metric_log>
      </clickhouse>

- name: Install clickhouse
  ansible.builtin.copy:
    dest: /etc/containers/systemd/clickhouse.container
    mode: "0640"
    content: |
      [Unit]
      Description=clickhouse

      [Install]
      WantedBy=default.target

      [Container]
      Image=docker.io/clickhouse/clickhouse-server:26.8-distroless
      ContainerName=clickhouse
      PublishPort=8123:8123
      Network=analytic.network
      Volume=/var/lib/clickhouse/data:/var/lib/clickhouse:U,rw,Z
      Volume=/var/lib/clickhouse/logs:/var/log/clickhouse-server:U,rw,Z
      Volume=/etc/clickhouse-server/config.d/system-log-rotation.xml:/etc/clickhouse-server/config.d/system-log-rotation.xml:U,ro,z
      Environment=CLICKHOUSE_DB=ais
      Environment=CLICKHOUSE_USER=ais
      Environment=CLICKHOUSE_PASSWORD=ais123
      Environment=CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1

      [Service]
      Restart=on-failure

- name: Ensure all services started
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    daemon_reload: true
  with_items:
    - clickhouse

- name: Install processors
  ansible.builtin.template:
    src: processor.container.tpl
    dest: /etc/containers/systemd/{{ item.name }}.container
    mode: "0640"
  loop: "{{ analytic_ais_data_nexus_processors }}"
  no_log: true

- name: Ensure processors started
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    state: started
    daemon_reload: true
  loop: "{{ analytic_ais_data_nexus_processors }}"
