---
analytic_nats_host: 192.168.123.123

analytic_lvm_disks:
  - /dev/sdb

analytic_clickhouse_log_size: 256G
analytic_clickhouse_data_size: 2T

analytic_ais_data_nexus_processors:
  - name: weather-indexer
    nats_stream: weather
    envs: &ch-env
      - name: CH_DB
        value: ais
      - name: CLICKHOUSE_USER
        value: ais
      - name: CLICKHOUSE_PASSWORD
        value: ais23
      - name: CLICKHOUSE_HOST
        value: clickhouse
  - name: camagri-indexer
    nats_stream: camagri
    envs: *ch-env
  - name: farmer-indexer
    nats_stream: farmer
    envs: *ch-env
