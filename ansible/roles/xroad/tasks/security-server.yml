---
- name: Configure trusted ca
  ansible.builtin.command: step ca bootstrap -f --install --ca-url {{ xroad_step_ca_url }} --fingerprint {{ xroad_step_ca_root_fingerprint }}
  when: xroad_ca_type == 'step-ca'
  changed_when: true

- name: Ensure xroad dir exists
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0750"
    state: directory
    recurse: true
  with_items:
    - /etc/xroad
    - /var/lib/xroad/data

- name: Install xroad security server
  ansible.builtin.copy:
    dest: /etc/containers/systemd/xroad-security-server.container
    mode: "0700"
    content: |
      [Unit]
      Description=xroad security server

      [Install]
      WantedBy=default.target

      [Container]
      Image=docker.io/niis/xroad-security-server-sidecar:7.8.3-fi
      ContainerName=xroad-security-server
      Network=xroad.network
      PublishPort=4000:4000
      PublishPort=5588:5588
      PublishPort=5500:5500
      PublishPort=5577:5577
      PublishPort=8888:8080
      Volume=/etc/xroad:/etc/xroad:rw,Z
      Volume=/var/lib/xroad/data:/var/lib/xroad:rw,Z

      Volume=/root/.step/certs/root_ca.crt:/usr/local/share/ca-certificates/ais-root-ca.crt:ro,Z
      {% for token in xroad_autologin %}
      # Environment=XROAD_TOKEN_{{ loop.index0 }}_PIN={{ token }}
      {% endfor %}
      Environment=XROAD_ADMIN_USER=jenna
      Environment=XROAD_ADMIN_PASSWORD=jenna@123
      Environment=XROAD_DB_HOST=xroad-pg
      Environment=XROAD_DB_PWD=xroadpg
      Environment=XROAD_PROXY_UI_API_ACME_CHALLENGE_PORT=8081

      [Service]
      Restart=on-failure
      ExecStartPost=/usr/bin/podman exec xroad-security-server update-ca-certificates --fresh

- name: Ensure xroad security server enabled and started
  ansible.builtin.systemd_service:
    name: xroad-security-server
    state: started
    enabled: true
    daemon_reload: true
