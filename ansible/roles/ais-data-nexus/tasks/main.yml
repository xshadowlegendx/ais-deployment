---
- name: Install podman
  ansible.builtin.dnf:
    name: podman
  when: ansible_os_family == 'RedHat'

- name: Install podman
  ansible.builtin.apt:
    name: podman
  when: ansible_os_family == 'Debian'

- name: Create data vg
  community.general.lvg:
    vg: data
    pvs: "{{ item }}"
    state: present
  loop: "{{ ais_data_nexus_lvm_disks }}"

- name: Create lvs
  community.general.lvol:
    vg: data
    lv: "{{ item.lv }}"
    size: "{{ item.size }}"
    state: present
  with_items:
    - lv: ais_data_nexus_nats
      size: "{{ ais_data_nexus_nats_data_size }}"

- name: Format lvs
  community.general.filesystem:
    dev: /dev/data/{{ item }}
    fstype: xfs
  with_items:
    - ais_data_nexus_nats

- name: Ensure ais data nexus nats data dir exists
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0750"
    recurse: true
    state: directory
  with_items:
    - /var/lib/ais-data-nexus/nats

- name: Ensure mount point exists
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: xfs
    opts: defaults
    state: mounted
  with_items:
    - path: /var/lib/ais-data-nexus/nats
      src: /dev/data/ais_data_nexus_nats

- name: Create ais data nexus network
  ansible.builtin.copy:
    dest: /etc/containers/systemd/ais-data-nexus.network
    mode: "0640"
    content: |
      [Network]
      NetworkName=ais-data-nexus

- name: Install ais data nexus nats
  ansible.builtin.copy:
    dest: /etc/containers/systemd/ais-data-nexus-nats.container
    mode: "0640"
    content: |
      [Unit]
      Description=ais data nexus nats

      [Install]
      WantedBy=default.target

      [Container]
      Image=docker.io/nats:2.12-alpine
      Network=ais-data-nexus.network
      ContainerName=ais-data-nexus-nats
      Exec=-js -sd /data
      PublishPort=4222:4222
      Volume=/var/lib/ais-data-nexus/nats:/data:rw,Z,U

      [Service]
      Restart=on-failure

- name: Install ais data nexus
  ansible.builtin.copy:
    dest: /etc/containers/systemd/ais-data-nexus.container
    mode: "0640"
    content: |
      [Unit]
      Description=ais data nexus

      [Install]
      WantedBy=default.target

      [Container]
      Image=ghcr.io/xshadowlegendx/ais-data-nexus:0.1.3
      Network=ais-data-nexus.network
      ContainerName=ais-data-nexus
      PublishPort=127.0.0.1:5629:5629
      Environment=RUST_LOG=INFO
      Environment=NATS_URL=nats://ais-data-nexus-nats:4222

      [Service]
      Restart=on-failure

- name: Ensure all services started
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    daemon_reload: true
  with_items:
    - ais-data-nexus-nats
    - ais-data-nexus
